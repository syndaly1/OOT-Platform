services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  content-postgres:
    image: postgres:16-alpine
    container_name: content-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_db
    ports:
      - "5433:5432"
    volumes:
      - content-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  playback-postgres:
    image: postgres:16-alpine
    container_name: playback-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playback_db
    ports:
      - "5434:5432"
    volumes:
      - playback-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - .env
    environment:
      AUTH_DB_HOST: auth-postgres
      AUTH_DB_PORT: 5432
      AUTH_DB_USER: postgres
      AUTH_DB_PASSWORD: postgres
      AUTH_DB_NAME: auth_db
      AUTH_DB_URL: postgres://postgres:postgres@auth-postgres:5432/auth_db?sslmode=disable
      AUTH_DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/auth_db?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@auth-postgres:5432/auth_db?sslmode=disable
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    ports:
      - "50051:50051"
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: content-service
    environment:
      CONTENT_DB_HOST: content-postgres
      CONTENT_DB_PORT: 5432
      CONTENT_DB_USER: postgres
      CONTENT_DB_PASSWORD: postgres
      CONTENT_DB_NAME: content_db
      CONTENT_DATABASE_URL: postgres://postgres:postgres@content-postgres:5432/content_db?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@content-postgres:5432/content_db?sslmode=disable
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    ports:
      - "50052:50052"
    depends_on:
      content-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  playback-service:
    build:
      context: .
      dockerfile: ./services/playback-service/Dockerfile
    container_name: playback-service
    environment:
      PLAYBACK_DB_HOST: playback-postgres
      PLAYBACK_DB_PORT: 5432
      PLAYBACK_DB_USER: postgres
      PLAYBACK_DB_PASSWORD: postgres
      PLAYBACK_DB_NAME: playback_db
      PLAYBACK_DB_URL: postgres://postgres:postgres@playback-postgres:5432/playback_db?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@playback-postgres:5432/playback_db?sslmode=disable
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
    ports:
      - "50053:50053"
    depends_on:
      playback-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      AUTH_SERVICE_URL: auth-service:50051
      CONTENT_SERVICE_URL: content-service:50052
      PLAYBACK_SERVICE_URL: playback-service:50053
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - content-service
      - playback-service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - api-gateway
      - nats

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  auth-postgres-data:
  content-postgres-data:
  playback-postgres-data:
  redis-data:
  grafana-data:
  loki-data:
  tempo-data: