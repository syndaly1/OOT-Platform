syntax = "proto3";

package content;

option go_package = "./proto/content;contentpb";

service ContentService {
  rpc CreateContent(CreateContentRequest) returns (ContentResponse);
  rpc GetContent(GetContentRequest) returns (ContentResponse);
  rpc ListContent(ListContentRequest) returns (ListContentResponse);
  rpc UpdateContent(UpdateContentRequest) returns (ContentResponse);
  rpc DeleteContent(DeleteContentRequest) returns (DeleteContentResponse);

  rpc SearchContent(SearchContentRequest) returns (ListContentResponse);
  rpc GetContentByGenre(GetContentByGenreRequest) returns (ListContentResponse);
  rpc GetTrendingContent(GetTrendingContentRequest) returns (ListContentResponse);
  rpc GetFeaturedContent(GetFeaturedContentRequest) returns (ListContentResponse);

  rpc CreateEpisode(CreateEpisodeRequest) returns (EpisodeResponse);
  rpc GetEpisode(GetEpisodeRequest) returns (EpisodeResponse);
  rpc ListEpisodesByContent(ListEpisodesByContentRequest) returns (ListEpisodesResponse);
  rpc UpdateEpisode(UpdateEpisodeRequest) returns (EpisodeResponse);
  rpc DeleteEpisode(DeleteEpisodeRequest) returns (DeleteEpisodeResponse);

  rpc SetSkipIntroMetadata(SetSkipIntroMetadataRequest) returns (EpisodeResponse);
}

message Content {
  string id = 1;
  string title = 2;
  string description = 3;
  string poster_url = 4;
  string type = 5;
  string genre = 6;
  int32 release_year = 7;
  double rating = 8;
  bool is_featured = 9;
  bool is_trending = 10;
  string created_at = 11;
  string updated_at = 12;
}

message Episode {
  string id = 1;
  string content_id = 2;
  string title = 3;
  string description = 4;
  int32 season_number = 5;
  int32 episode_number = 6;
  int32 duration_seconds = 7;
  int32 skip_intro_start = 8;
  int32 skip_intro_end = 9;
  string created_at = 10;
  string updated_at = 11;
}

message CreateContentRequest {
  string title = 1;
  string description = 2;
  string poster_url = 3;
  string type = 4;
  string genre = 5;
  int32 release_year = 6;
  double rating = 7;
  bool is_featured = 8;
  bool is_trending = 9;
}

message GetContentRequest {
  string id = 1;
}

message ListContentRequest {
  int32 page = 1;
  int32 limit = 2;
}

message UpdateContentRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string poster_url = 4;
  string type = 5;
  string genre = 6;
  int32 release_year = 7;
  double rating = 8;
  bool is_featured = 9;
  bool is_trending = 10;
}

message DeleteContentRequest {
  string id = 1;
}

message DeleteContentResponse {
  string message = 1;
}

message SearchContentRequest {
  string query = 1;
}

message GetContentByGenreRequest {
  string genre = 1;
}

message GetTrendingContentRequest {
  int32 limit = 1;
}

message GetFeaturedContentRequest {
  int32 limit = 1;
}

message ContentResponse {
  Content content = 1;
}

message ListContentResponse {
  repeated Content contents = 1;
}

message CreateEpisodeRequest {
  string content_id = 1;
  string title = 2;
  string description = 3;
  int32 season_number = 4;
  int32 episode_number = 5;
  int32 duration_seconds = 6;
}

message GetEpisodeRequest {
  string id = 1;
}

message ListEpisodesByContentRequest {
  string content_id = 1;
}

message UpdateEpisodeRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 season_number = 4;
  int32 episode_number = 5;
  int32 duration_seconds = 6;
}

message DeleteEpisodeRequest {
  string id = 1;
}

message DeleteEpisodeResponse {
  string message = 1;
}

message SetSkipIntroMetadataRequest {
  string episode_id = 1;
  int32 skip_intro_start = 2;
  int32 skip_intro_end = 3;
}

message EpisodeResponse {
  Episode episode = 1;
}

message ListEpisodesResponse {
  repeated Episode episodes = 1;
}